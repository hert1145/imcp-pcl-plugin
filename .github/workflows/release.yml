name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 只取插件 SDK，不检出整个 pcl-lite：整个仓库的 XAML 会被 SDK 工程的 WPF 目标
      # 扫进来（宿主 UI 一起参与编译），在插件工程里必然报 MC3074。
      - name: Checkout PCL Lite SDK
        uses: actions/checkout@v4
        with:
          repository: askbbtsk/pcl-lite
          path: pcl-lite
          sparse-checkout: |
            PCL.Plugin.SDK
          sparse-checkout-cone-mode: true

      - name: Locate PCL Lite SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $PWD "pcl-lite/PCL.Plugin.SDK"
          if (-not (Test-Path (Join-Path $sdk "PCL.Plugin.SDK.csproj"))) {
            throw "PCL.Plugin.SDK not found at $sdk"
          }
          "PCL_LITE_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build plugin
        shell: pwsh
        run: |
          # 把插件源码复制到仓库外的目录再编译，避免 SDK 工程里的 glob 抓到宿主 XAML。
          $stage = Join-Path $env:RUNNER_TEMP "plugin-build"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "ControlPage.cs", "ImcProxyApi.cs", "ImcProxyRuntime.cs", "Plugin.cs" $stage -Force
          Copy-Item "plugin.json" $stage -Force
          Copy-Item "PCL.Plugin.ImcProxy.csproj" $stage -Force
          Push-Location $stage
          dotnet build "PCL.Plugin.ImcProxy.csproj" -c Release "-p:PclLiteDir=$env:PCL_LITE_SDK\..\"
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          Pop-Location
          "PLUGIN_BUILD=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package .pclplugin
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "main") { $tag = "v" + (Get-Content plugin.json -Raw | ConvertFrom-Json).version }
          $dist = Join-Path $PWD "dist/imcproxy.control"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item (Join-Path $env:PLUGIN_BUILD "bin/Release/net10.0-windows/PCL.Plugin.ImcProxy.dll") $dist -Force
          Copy-Item "plugin.json" $dist -Force
          $asset = Join-Path $PWD "dist/imcproxy.control-$tag.pclplugin"
          if (Test-Path $asset) { Remove-Item $asset -Force }
          # Compress-Archive 只认 .zip，这里用 ZipFile 保留 .pclplugin 后缀
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $dist, $asset, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "asset: $asset"
          Write-Host "sha256: $hash"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ASSET_TAG }}
          files: dist/imcproxy.control-${{ env.ASSET_TAG }}.pclplugin

      - name: Summary
        shell: pwsh
        run: |
          $version = (Get-Content plugin.json -Raw | ConvertFrom-Json).version
          @"
          插件包：imcproxy.control-$env:ASSET_TAG.pclplugin
          SHA-256：$env:SHA256
          市场规模条目：
          ```json
          {
            "id": "imcproxy.control",
            "name": "IMCProxy",
            "version": "$version",
            "author": "IMCProxy",
            "description": "在 PCL Lite 中下载、启动并配置 IMCProxy-NextGen-Free，通过 HTTP API 控制，不显示控制台。",
            "packageUrl": "https://github.com/${{ github.repository }}/releases/download/$env:ASSET_TAG/imcproxy.control-$env:ASSET_TAG.pclplugin",
            "website": "https://github.com/${{ github.repository }}",
            "sha256": "$env:SHA256"
          }
          ```
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
