name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Checkout PCL Lite SDK
        uses: actions/checkout@v4
        with:
          repository: askbbtsk/pcl-lite
          path: pcl-lite

      - name: Build plugin
        run: dotnet build PCL.Plugin.ImcProxy.csproj -c Release -p:PclLiteDir=${{ github.workspace }}\pcl-lite\

      - name: Package .pclplugin
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dist = Join-Path $PWD "dist/imcproxy.control"
          Copy-Item "bin/Release/net10.0-windows/PCL.Plugin.ImcProxy.dll" $dist -Force
          Copy-Item "plugin.json" $dist -Force
          $asset = Join-Path $PWD "dist/imcproxy.control-$tag.pclplugin"
          Compress-Archive -Path (Join-Path $dist "*") -DestinationPath $asset -CompressionLevel Optimal
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "asset: $asset"
          Write-Host "sha256: $hash"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/imcproxy.control-${{ github.ref_name }}.pclplugin

      - name: Summary
        shell: pwsh
        run: |
          @"
          插件包：imcproxy.control-${{ github.ref_name }}.pclplugin
          SHA-256：$env:SHA256
          市场规模条目：
          ```json
          {
            "id": "imcproxy.control",
            "name": "IMCProxy",
            "version": "1.0.0",
            "author": "IMCProxy",
            "description": "在 PCL Lite 中下载、启动并配置 IMCProxy-Free，通过 HTTP API 控制，不显示控制台。",
            "packageUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/imcproxy.control-${{ github.ref_name }}.pclplugin",
            "website": "https://github.com/${{ github.repository }}",
            "sha256": "$env:SHA256"
          }
          ```
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
