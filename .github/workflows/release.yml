name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # 鍙彇鎻掍欢 SDK锛屼笉妫€鍑烘暣涓?pcl-lite锛氭暣涓粨搴撶殑 XAML 浼氳 SDK 椤圭洰鐨?      # WPF 鐩爣鎵繘鍘伙紙SpringNote 浼氭妸瀹夸富 UI 涓€璧风紪璇戯級锛屽湪鎻掍欢宸ョ▼閲屽繀鐒舵姤 MC3074銆?      - name: Checkout PCL Lite SDK
        uses: actions/checkout@v4
        with:
          repository: askbbtsk/pcl-lite
          path: pcl-lite
          sparse-checkout: |
            PCL.Plugin.SDK
          sparse-checkout-cone-mode: true

      - name: Locate PCL Lite SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $PWD "pcl-lite/PCL.Plugin.SDK"
          if (-not (Test-Path (Join-Path $sdk "PCL.Plugin.SDK.csproj"))) {
            throw "PCL.Plugin.SDK not found at $sdk"
          }
          "PCL_LITE_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build plugin
        shell: pwsh
        run: |
          # 鎶婃彃浠舵簮鐮佸鍒跺埌浠撳簱澶栫殑鐩綍鍐嶇紪璇戯紝閬垮厤 SDK 椤圭洰閲岀殑 glob 鎶撲笉鍒板涓荤殑 XAML銆?          $stage = Join-Path $env:RUNNER_TEMP "plugin-build"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "ControlPage.cs", "ImcProxyApi.cs", "ImcProxyRuntime.cs", "Plugin.cs" $stage -Force
          Copy-Item "plugin.json" $stage -Force
          Copy-Item "PCL.Plugin.ImcProxy.csproj" $stage -Force
          Push-Location $stage
          dotnet build "PCL.Plugin.ImcProxy.csproj" -c Release "-p:PclLiteDir=$env:PCL_LITE_SDK\..\"
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          Pop-Location
          "PLUGIN_BUILD=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package .pclplugin
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dist = Join-Path $PWD "dist/imcproxy.control"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item (Join-Path $env:PLUGIN_BUILD "bin/Release/net10.0-windows/PCL.Plugin.ImcProxy.dll") $dist -Force
          Copy-Item "plugin.json" $dist -Force
          $asset = Join-Path $PWD "dist/imcproxy.control-$tag.pclplugin"
          if (Test-Path $asset) { Remove-Item $asset -Force }
          # Compress-Archive 鍙 .zip锛岃繖閲岀敤 ZipFile 淇濈暀 .pclplugin 鍚庣紑
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $dist, $asset, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "asset: $asset"
          Write-Host "sha256: $hash"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/imcproxy.control-${{ github.ref_name }}.pclplugin

      - name: Summary
        shell: pwsh
        run: |
          $version = (Get-Content plugin.json -Raw | ConvertFrom-Json).version
          @"
          鎻掍欢鍖咃細imcproxy.control-${{ github.ref_name }}.pclplugin
          SHA-256锛?env:SHA256
          甯傚満瑙勬ā鏉＄洰锛?          ```json
          {
            "id": "imcproxy.control",
            "name": "IMCProxy",
            "version": "$version",
            "author": "IMCProxy",
            "description": "鍦?PCL Lite 涓笅杞姐€佸惎鍔ㄥ苟閰嶇疆 IMCProxy-NextGen-Free锛岄€氳繃 HTTP API 鎺у埗锛屼笉鏄剧ず鎺у埗鍙般€?,
            "packageUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/imcproxy.control-${{ github.ref_name }}.pclplugin",
            "website": "https://github.com/${{ github.repository }}",
            "sha256": "$env:SHA256"
          }
          ```
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
